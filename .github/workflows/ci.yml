name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  build:
    name: Lint · Typecheck · Build · Unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test:unit

      - name: Build
        env:
          # CI build only - these env vars are placeholders, never secrets.
          # Mock mode is what lets the build proceed without real Supabase
          # credentials: lib/config.ts requires NEXT_PUBLIC_SUPABASE_URL /
          # _ANON_KEY in production live mode, but treats them as
          # "feature disabled" in mock mode (sentinel empty string). The
          # bundle compiled here is the same one the dev server runs with
          # `pnpm dev` + NEXT_PUBLIC_API_MODE=mock; a real-mode build check
          # would need Supabase secrets added to the repo and is a separate
          # follow-up.
          NEXT_PUBLIC_API_URL: https://api.example.com
          NEXT_PUBLIC_API_MODE: mock
        run: pnpm build

  security:
    name: Audit · Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # Full history so the OSS gitleaks CLI can scan every commit, not
          # just the tip. Matches the historical gitleaks/gitleaks-action@v2
          # behaviour. Default fetch-depth=1 would only scan the latest commit.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: npm audit (high+ severity)
        run: pnpm audit --audit-level=high

      - name: gitleaks secret scan
        # Use the OSS gitleaks binary directly instead of
        # gitleaks/gitleaks-action@v2, which now requires a paid
        # GITLEAKS_LICENSE secret for organization repos. The CLI is the
        # same scanner, MIT-licensed, no per-org gate.
        run: |
          set -euo pipefail
          VERSION="8.21.2"
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version
          # `detect` scans git history by default; --redact masks any hit
          # in the log; --exit-code 1 fails the job on findings.
          gitleaks detect --source . --redact --exit-code 1 --no-banner
